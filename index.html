<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Friday Niite Freestyle: Refreshed</title>
	
	<meta name="description" content="Friday Niite Freestyle: Refreshed - A Psych Engine HTML5 port. Play in your browser!">
	<meta name="theme-color" content="#000000">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<meta name="mobile-web-app-capable" content="yes">
	
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	
	<link rel="shortcut icon" type="image/png" href="./favicon.png">
	<link rel="apple-touch-icon" href="./favicon.png">
	
	<!-- Open Graph / social -->
	<meta property="og:title" content="Friday Niite Freestyle: Refreshed">
	<meta property="og:description" content="Play this Psych Engine based FNF mod right in your browser!">
	<meta property="og:type" content="website">
	<meta property="og:image" content="./favicon.png">
	
	<script type="text/javascript" src="./Freestyle Refreshed.js"></script>
	
	<script>
		// Prevent default touch scrolling on mobile
		window.addEventListener("touchmove", function (event) { event.preventDefault(); }, { capture: false, passive: false });
		
		// High DPI adjustment
		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById("viewport");
			meta.setAttribute('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}
	</script>
	
	<style>
		html, body {
			margin: 0;
			padding: 0;
			height: 100%;
			overflow: hidden;
			background: #000;
			font-family: 'VCR OSD Mono', monospace, system-ui, sans-serif;
			color: #fff;
		}
		#openfl-content {
			background: #000000;
			width: 100%;
			height: 100%;
			position: relative;
		}
		#loading {
			position: absolute;
			top: 0; left: 0; right: 0; bottom: 0;
			display: flex;
			flex-direction: column;
			align-items: center;
			justify-content: center;
			background: #000;
			z-index: 10;
			text-align: center;
			padding: 20px;
			box-sizing: border-box;
		}
		#loading h1 {
			font-size: 1.8rem;
			margin: 0 0 12px 0;
			letter-spacing: 1px;
		}
		#loading p {
			margin: 6px 0;
			opacity: 0.85;
			font-size: 0.95rem;
		}
		#loading .hint {
			margin-top: 24px;
			font-size: 0.8rem;
			opacity: 0.6;
			max-width: 420px;
			line-height: 1.4;
		}
		#loading .spinner {
			width: 40px;
			height: 40px;
			border: 4px solid rgba(255,255,255,0.2);
			border-top-color: #fff;
			border-radius: 50%;
			animation: spin 0.9s linear infinite;
			margin-bottom: 20px;
		}
		@keyframes spin {
			to { transform: rotate(360deg); }
		}
		@font-face {
			font-family: 'VCR OSD Mono';
			src: url('assets/fonts/vcr.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Pixel Arial 11 Bold';
			src: url('assets/fonts/pixel.otf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Nokia Cellphone FC Small';
			src: url('flixel/fonts/nokiafc22.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
		@font-face {
			font-family: 'Monsterrat';
			src: url('flixel/fonts/monsterrat.ttf') format('truetype');
			font-weight: normal;
			font-style: normal;
		}
	</style>
</head>
<body>
	<noscript>
		<div style="padding:40px;text-align:center;font-family:sans-serif;">
			This game requires JavaScript. Please enable it in your browser.
		</div>
	</noscript>
	
	<div id="openfl-content">
		<div id="loading">
			<div class="spinner"></div>
			<h1>Friday Niite Freestyle</h1>
			<p>Refreshed • Psych Engine HTML5</p>
			<p>Loading game files... (this can take a moment on first visit)</p>
			<p class="hint">
				Tip: For best performance use Chrome / Edge. On mobile, add to Home Screen for fullscreen.
				<br><br>
				Source & credits on the repo →
				<a href="https://github.com/Playboyjusthegreat27/freestyle-html" style="color:#8af;" target="_blank" rel="noopener">GitHub</a>
			</p>
		</div>
	</div>
	
	<script type="text/javascript">
		// Hide loading screen once the game starts embedding
		function hideLoading() {
			var el = document.getElementById('loading');
			if (el) el.style.display = 'none';
		}
		
		// Give the big JS a moment, then embed
		window.addEventListener('load', function() {
			try {
				lime.embed("Freestyle Refreshed", "openfl-content", 1280, 720, { parameters: {} });
				// Hide loading after a short delay (game canvas usually takes over)
				setTimeout(hideLoading, 2500);
			} catch (e) {
				console.error(e);
				var el = document.getElementById('loading');
				if (el) {
					el.innerHTML = '<h1>Failed to load</h1><p>Check the browser console for errors.</p><p class="hint">' + (e.message || e) + '</p>';
				}
			}
		});
	</script>
</body>
</html>
